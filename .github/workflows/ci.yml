name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy python-multipart

      - name: Run scanner test
        run: |
          python -c "from scanner.engine import scan_code; code=open('tests/vulnerable_all.py').read(); findings=scan_code(code); print('Findings:', len(findings)); assert len(findings) >= 5"